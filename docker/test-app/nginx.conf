events {}
http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;
    server {
        listen 8081;
        server_name _;
        root /usr/share/nginx/html;

        location = /error500 {
            return 500 "simulated backend error";
        }
        location = /login {
            return 401 "unauthorized";
        }
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
